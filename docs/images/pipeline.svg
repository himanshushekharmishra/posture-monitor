<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <title>Posture Monitor pipeline: webcam to pose landmarks to posture score to alert</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6fd1"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#eef5fd"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="299" rx="18" fill="url(#bg)" stroke="#d4e4f5"/>

  <!-- on-device boundary -->
  <rect x="24" y="44" width="912" height="190" rx="14" fill="none" stroke="#1f6fd1" stroke-dasharray="6 6" stroke-opacity="0.5"/>
  <rect x="40" y="33" width="210" height="22" rx="11" fill="#e3effd"/>
  <text x="145" y="49" text-anchor="middle" font-size="13" font-weight="600" fill="#1559ad">Runs on your machine</text>

  <!-- 1 webcam -->
  <g transform="translate(44,72)">
    <rect width="150" height="140" rx="12" fill="#ffffff" stroke="#d4e4f5"/>
    <circle cx="75" cy="46" r="24" fill="#0f2036"/>
    <circle cx="75" cy="46" r="11" fill="#1f6fd1"/>
    <circle cx="79" cy="42" r="3.5" fill="#e3effd"/>
    <rect x="62" y="72" width="26" height="6" rx="3" fill="#0f2036"/>
    <text x="75" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#102a43">Webcam</text>
    <text x="75" y="123" text-anchor="middle" font-size="12" fill="#486581">~5 frames / second</text>
  </g>

  <!-- 2 pose -->
  <g transform="translate(228,72)">
    <rect width="150" height="140" rx="12" fill="#ffffff" stroke="#d4e4f5"/>
    <g stroke="#1f6fd1" stroke-width="2.5" stroke-linecap="round">
      <line x1="60" y1="58" x2="90" y2="58"/>
      <line x1="64" y1="36" x2="86" y2="36"/>
      <line x1="60" y1="58" x2="56" y2="84"/>
      <line x1="90" y1="58" x2="94" y2="84"/>
    </g>
    <g fill="#f0a020">
      <circle cx="75" cy="30" r="4"/>
      <circle cx="64" cy="36" r="4"/><circle cx="86" cy="36" r="4"/>
      <circle cx="60" cy="58" r="4"/><circle cx="90" cy="58" r="4"/>
    </g>
    <text x="75" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#102a43">MediaPipe pose</text>
    <text x="75" y="123" text-anchor="middle" font-size="12" fill="#486581">33 body points</text>
  </g>

  <!-- 3 features -->
  <g transform="translate(412,72)">
    <rect width="150" height="140" rx="12" fill="#ffffff" stroke="#d4e4f5"/>
    <g font-size="11.5" font-family="Consolas, monospace" fill="#102a43">
      <text x="20" y="32">neck_ratio</text>
      <text x="20" y="50">lean_ratio</text>
      <text x="20" y="68">shoulder_tilt</text>
      <text x="20" y="86">head_tilt</text>
    </g>
    <text x="75" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#102a43">Features</text>
    <text x="75" y="126" text-anchor="middle" font-size="12" fill="#486581">vs. your baseline</text>
  </g>

  <!-- 4 score + state -->
  <g transform="translate(596,72)">
    <rect width="150" height="140" rx="12" fill="#ffffff" stroke="#d4e4f5"/>
    <rect x="22" y="30" width="106" height="12" rx="6" fill="#e3effd"/>
    <rect x="22" y="30" width="38" height="12" rx="6" fill="#2f8a5f"/>
    <line x1="49" y1="24" x2="49" y2="48" stroke="#b7791f" stroke-width="2"/>
    <g font-size="10.5" font-weight="600">
      <rect x="14" y="58" width="38" height="18" rx="9" fill="#2f8a5f"/><text x="33" y="71" text-anchor="middle" fill="#fff">GOOD</text>
      <rect x="56" y="58" width="44" height="18" rx="9" fill="#b7791f"/><text x="78" y="71" text-anchor="middle" fill="#fff">SLOUCH</text>
      <rect x="104" y="58" width="36" height="18" rx="9" fill="#c0392b"/><text x="122" y="71" text-anchor="middle" fill="#fff">ALERT</text>
    </g>
    <text x="75" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#102a43">Score + state</text>
    <text x="75" y="123" text-anchor="middle" font-size="12" fill="#486581">smoothed, 30 s grace</text>
  </g>

  <!-- 5 outputs -->
  <g transform="translate(780,72)">
    <rect width="140" height="140" rx="12" fill="#ffffff" stroke="#d4e4f5"/>
    <rect x="18" y="20" width="104" height="34" rx="8" fill="#0f2036"/>
    <text x="70" y="34" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e5eef9">Sit up straight</text>
    <text x="70" y="47" text-anchor="middle" font-size="9.5" fill="#9db2cc">slouching for 30 s</text>
    <ellipse cx="44" cy="72" rx="12" ry="4" fill="#d4e4f5"/>
    <rect x="32" y="64" width="24" height="16" fill="#d4e4f5"/>
    <ellipse cx="44" cy="64" rx="12" ry="4" fill="#486581"/>
    <circle cx="96" cy="70" r="9" fill="#2f8a5f"/>
    <text x="70" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#102a43">Notify + log</text>
    <text x="70" y="123" text-anchor="middle" font-size="12" fill="#486581">toast, SQLite, tray</text>
  </g>

  <!-- arrows -->
  <g stroke="#1f6fd1" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="196" y1="142" x2="224" y2="142"/>
    <line x1="380" y1="142" x2="408" y2="142"/>
    <line x1="564" y1="142" x2="592" y2="142"/>
    <line x1="748" y1="142" x2="776" y2="142"/>
  </g>

  <text x="480" y="268" text-anchor="middle" font-size="14" fill="#486581">Frames never leave the pipeline: no video is saved or uploaded, only posture numbers and events.</text>
</svg>
