# Runs the test suite on every push and pull request. Windows, because that's the
# target OS (and test_control checks the Windows single-instance mutex). No camera
# or pose model is needed: the tests use fake landmarks and generated video.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
